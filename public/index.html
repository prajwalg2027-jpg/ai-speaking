<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Sakhi · English Coach</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="split">
  <main class="app" data-state="idle">
    <header class="top">
      <span class="brand">Sakhi</span>
      <button type="button" class="cost" id="cost" hidden aria-expanded="false" aria-controls="costDetail" title="Sarvam API cost of this conversation (estimate)">
        <span class="cost-label">Cost</span> <span id="costTotal">₹0.00</span>
      </button>
    </header>
    <div class="cost-detail" id="costDetail" hidden></div>

    <section class="stage">
      <div class="orb-wrap">
        <button class="orb" id="orb" aria-label="Start talking"><span class="orb-core"></span></button>
      </div>
      <div class="convo" id="convo" aria-live="polite"></div>
      <div class="card" id="card" hidden></div>
      <p class="hint" id="hint"></p>
    </section>

    <section class="result" id="result" hidden></section>

    <footer class="chips" id="chips" hidden>
      <button data-act="repeat">🔁 Repeat</button>
      <button data-act="in_hindi">अ Hindi mein</button>
      <button data-act="done">✓ Done speaking</button>
      <button data-act="skip">Skip →</button>
    </footer>
  </main>
  <aside class="logs" id="logs" aria-label="Live logs"></aside>
  </div>
  <button type="button" class="logs-open" id="logsOpen" hidden>Show logs</button>
  <script type="module" src="/app.js"></script>
</body>
</html>
