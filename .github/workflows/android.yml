# Builds and checks the Android app on every push and pull request that touches it:
# unit tests (incl. screen renders), Android lint, a debug APK, and a release bundle when signing secrets exist.
name: Android

on:
  push:
    paths: ["android/**", "server/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", "server/**", ".github/workflows/android.yml"]

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # to sign in to Google Cloud without a stored key (publishing the test build)
    env:
      HAS_KEYSTORE: ${{ secrets.SAKHI_KEYSTORE_B64 != '' }}
      # Truecaller one-tap sign-in (Truecaller developer console; not secret). Empty: SMS code only.
      TRUECALLER_CLIENT_ID: ${{ vars.TRUECALLER_CLIENT_ID }}
      TRUECALLER_CLIENT_ID_DEBUG: ${{ vars.TRUECALLER_CLIENT_ID_DEBUG }}
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" > /dev/null
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest
      - name: Lint
        run: ./gradlew :app:lintDebug
      - name: Debug APK
        run: ./gradlew :app:assembleDebug -Psakhi.versionCode=${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            android/app/build/reports/
            android/app/build/screenshots/
      - uses: actions/upload-artifact@v4
        with:
          name: adam-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
      # PRE-PRODUCTION ONLY (remove before launch, with server/builds.js): the latest test build on the team's
      # download page, adamspeaks.in/internal/<token>. Set up by deploy/builds-setup.sh. The values below aren't secret
      # (keyless sign-in, limited to this repository's tutor-conversation and main); GitHub variables can override them.
      - name: Sign in to Google Cloud (test build page)
        id: gcp
        if: github.event_name == 'push' && (github.ref == 'refs/heads/tutor-conversation' || github.ref == 'refs/heads/main')
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER || 'projects/209464958247/locations/global/workloadIdentityPools/github/providers/ai-speaking' }}
          service_account: ${{ vars.GCP_BUILDS_SA || 'adam-ci-builds@cool-arch-515210-b0.iam.gserviceaccount.com' }}
      - name: Set up gcloud (test build page)
        if: steps.gcp.outcome == 'success'
        uses: google-github-actions/setup-gcloud@v2
      - name: Upload the test build
        if: steps.gcp.outcome == 'success'
        env:
          BUCKET: ${{ vars.BUILDS_BUCKET || 'cool-arch-515210-b0-adam-builds' }}
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          jq -n --arg commit "$GITHUB_SHA" --arg branch "$GITHUB_REF_NAME" --arg message "$MESSAGE" \
            --argjson versionCode "$GITHUB_RUN_NUMBER" --arg versionName "$(grep -o 'versionName = "[^"]*"' app/build.gradle.kts | cut -d'"' -f2)" \
            --arg builtAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --argjson sizeBytes "$(stat -c%s "$APK")" \
            '{versionCode:$versionCode, versionName:$versionName, commit:$commit, branch:$branch, message:$message, builtAt:$builtAt, sizeBytes:$sizeBytes}' > build.json
          gcloud storage cp "$APK" "gs://${BUCKET}/latest/adam-test.apk"
          gcloud storage cp build.json "gs://${BUCKET}/latest/build.json"
          echo "Published build ${GITHUB_RUN_NUMBER} to the test build page."
      - name: Release bundle (signed)
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.SAKHI_KEYSTORE_B64 }}
          SAKHI_SERVER_URL: ${{ vars.SAKHI_SERVER_URL }}
          SAKHI_KEYSTORE_PASSWORD: ${{ secrets.SAKHI_KEYSTORE_PASSWORD }}
          SAKHI_KEY_ALIAS: ${{ secrets.SAKHI_KEY_ALIAS }}
          SAKHI_KEY_PASSWORD: ${{ secrets.SAKHI_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/sakhi.jks"
          SAKHI_KEYSTORE_FILE="$RUNNER_TEMP/sakhi.jks" ./gradlew :app:bundleRelease -Psakhi.versionCode=${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('android/app/build/outputs/bundle/release/*.aab') != '' }}
        with:
          name: adam-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
